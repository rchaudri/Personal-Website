<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">A graph of code relationships</title>
  <desc id="description">An illustrative repository graph connects a repository, source modules, a parsing function, a Token class, and tests. Teal, copper, and lavender distinguish the different entities. This is a conceptual example, not a Texas Instruments system diagram.</desc>
  <defs>
    <radialGradient id="background" cx="52%" cy="44%" r="75%">
      <stop stop-color="#173f48"/>
      <stop offset="1" stop-color="#091a23"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop stop-color="#64d8cf" stop-opacity=".13"/>
      <stop offset="1" stop-color="#64d8cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copper-halo">
      <stop stop-color="#f6a276" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f6a276" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6ed9cb"/>
      <stop offset=".6" stop-color="#7fe8dc"/>
      <stop offset="1" stop-color="#f6b086"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#204d55"/>
      <stop offset="1" stop-color="#102e38"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#aad7d5" opacity=".11"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="shadow" x="-40%" y="-50%" width="180%" height="220%">
      <feDropShadow dy="14" stdDeviation="18" flood-color="#020d15" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1440" height="960" fill="url(#background)"/>
  <rect width="1440" height="960" fill="url(#dots)"/>
  <ellipse cx="660" cy="510" rx="510" ry="390" fill="url(#halo)"/>
  <ellipse cx="1160" cy="290" rx="310" ry="300" fill="url(#copper-halo)"/>
  <g fill="none" stroke="#6eabae" stroke-opacity=".07">
    <ellipse cx="738" cy="500" rx="540" ry="282" transform="rotate(-17 738 500)"/>
    <ellipse cx="738" cy="500" rx="625" ry="365" transform="rotate(-17 738 500)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="88" fill="#8fb6ba" font-size="23" letter-spacing="3">CODE INTELLIGENCE</text>
    <text x="76" y="145" fill="#edf8f5" font-size="44" letter-spacing="-1">Repository graph</text>
    <g fill="none" stroke="#4a7f88" stroke-width="2" stroke-opacity=".48">
      <path d="M287 514C250 387 150 417 138 289M287 514C178 567 163 666 200 735M287 514C400 544 343 759 473 815"/>
      <path d="M478 280C510 200 612 183 668 217M478 280C390 242 388 181 316 195M478 280C413 327 377 346 365 401"/>
      <path d="M733 486C850 420 803 254 905 217M733 486C800 590 868 541 940 531M733 486C828 434 913 420 958 387"/>
      <path d="M1140 291C1223 282 1248 210 1326 231M1140 291C1253 320 1222 423 1310 455M1140 291C1091 195 1146 167 1187 164"/>
      <path d="M1156 654C1212 565 1322 620 1314 724M1156 654C1212 725 1141 807 1243 824M733 752C801 815 860 780 882 836M733 752C666 837 608 798 594 854"/>
    </g>
    <g fill="#254e58" stroke="#6a9da4" stroke-width="2">
      <circle cx="138" cy="289" r="10"/><circle cx="200" cy="735" r="13"/><circle cx="473" cy="815" r="9"/>
      <circle cx="668" cy="217" r="9"/><circle cx="316" cy="195" r="11"/><circle cx="365" cy="401" r="8"/>
      <circle cx="905" cy="217" r="12"/><circle cx="940" cy="531" r="11"/><circle cx="958" cy="387" r="8"/>
      <circle cx="1326" cy="231" r="8"/><circle cx="1310" cy="455" r="12"/><circle cx="1187" cy="164" r="8"/>
      <circle cx="1314" cy="724" r="10"/><circle cx="1243" cy="824" r="8"/><circle cx="882" cy="836" r="11"/><circle cx="594" cy="854" r="8"/>
    </g>
    <!-- Highlighted relationships form the visual focus. -->
    <g fill="none" stroke-width="3">
      <path d="M287 514C359 514 352 280 478 280" stroke="#63b7b3"/>
      <path d="M287 514C460 514 533 486 733 486" stroke="url(#trace)"/>
      <path d="M478 280C652 280 580 486 733 486" stroke="#63b7b3"/>
      <path d="M733 486C934 486 919 291 1140 291" stroke="url(#trace)"/>
      <path d="M733 486C906 486 960 654 1156 654" stroke="#c6aef0" stroke-opacity=".85"/>
      <path d="M733 752C644 680 648 583 733 486" stroke="#69c9c1" stroke-dasharray="9 10"/>
    </g>
    <path d="M287 514C460 514 533 486 733 486C934 486 919 291 1140 291" fill="none" stroke="#7de2d3" stroke-width="10" opacity=".2" filter="url(#glow)"/>
    <g font-size="22" fill="#9ec3c7" letter-spacing="2">
      <text x="426" y="477">CONTAINS</text>
      <text x="915" y="365" fill="#d5b6a2">DEFINES</text>
      <text x="933" y="588" fill="#baadd9">USES</text>
      <text x="636" y="630" transform="rotate(-90 636 630)">TESTS</text>
    </g>
    <!-- Source repository. -->
    <g transform="translate(287 514)" filter="url(#shadow)">
      <circle r="72" fill="#102f39" stroke="#609c9d" stroke-width="2"/>
      <circle r="58" fill="#224b54"/>
      <g fill="none" stroke="#b6e1dc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-26-13V25H26V-8H0L-9-19H-26V-13Z"/>
        <path d="M-25-7H25"/>
      </g>
    </g>
    <text x="287" y="628" text-anchor="middle" fill="#e9f5f2" font-size="34">Repository</text>
    <!-- Modules. -->
    <g transform="translate(478 280)" filter="url(#shadow)">
      <circle r="48" fill="#214c54" stroke="#70cfc6" stroke-width="2"/>
      <path d="M-13-20H5L16-9V20H-13Z M5-20V-9H16" fill="none" stroke="#a9e6db" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="478" y="365" text-anchor="middle" fill="#e9f5f2" font-size="32">index.ts</text>
    <g transform="translate(733 486)" filter="url(#shadow)">
      <circle r="90" fill="none" stroke="#80d8ca" stroke-opacity=".16" stroke-width="1.5"/>
      <circle r="77" fill="url(#node)" stroke="#8be4d5" stroke-width="3"/>
      <path d="M-21-30H8L26-12V31H-21Z M8-30V-12H26" fill="none" stroke="#b4f1e4" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-9 2L-16 10L-9 18M12 2L19 10L12 18" fill="none" stroke="#b4f1e4" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect x="638" y="586" width="190" height="53" rx="12" fill="#163b44" stroke="#467d80"/>
    <text x="733" y="623" text-anchor="middle" fill="#e9f8f2" font-size="34">parser.ts</text>
    <!-- A function, a class, and a test module. -->
    <g transform="translate(1140 291)" filter="url(#shadow)">
      <circle r="63" fill="#493f3b" stroke="#f6b086" stroke-width="2.5"/>
      <text y="16" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="53" fill="#ffd0ad">ƒ</text>
    </g>
    <text x="1140" y="395" text-anchor="middle" fill="#f5dbc8" font-size="34">parse()</text>
    <g transform="translate(1156 654)" filter="url(#shadow)">
      <circle r="59" fill="#33364f" stroke="#c6aef0" stroke-width="2.5"/>
      <path d="M0-24L24-11V15L0 29L-24 15V-11Z M-24-11L0 3L24-11M0 3V29" fill="none" stroke="#dfcef9" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="1156" y="754" text-anchor="middle" fill="#e8ddfa" font-size="34">Token</text>
    <g transform="translate(733 752)" filter="url(#shadow)">
      <circle r="42" fill="#17444c" stroke="#69c9c1" stroke-width="2"/>
      <path d="M-15 0L-4 11L17-13" fill="none" stroke="#b1eadb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="733" y="837" text-anchor="middle" fill="#d4eeea" font-size="30">parser.test.ts</text>
    <!-- Restrained, readable legend. -->
    <path d="M76 885H1364" stroke="#477078" stroke-opacity=".6"/>
    <g font-size="23" fill="#afcbcc">
      <circle cx="87" cy="924" r="6" fill="#80d8ca"/><text x="108" y="932">Modules</text>
      <circle cx="303" cy="924" r="6" fill="#f6b086"/><text x="324" y="932">Functions</text>
      <circle cx="539" cy="924" r="6" fill="#c6aef0"/><text x="560" y="932">Classes</text>
    </g>
  </g>
</svg>
